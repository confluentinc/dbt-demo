version: 2

models:
  - name: stg_orders
    description: >
      Cleaned and normalised order events from the raw_orders streaming source.
      Filters out any rows with non-positive amounts and lowercases the status field.

    columns:
      - name: order_id
        description: Unique identifier for the order.
        tests:
          - not_null

      - name: customer_id
        description: Identifier for the customer who placed the order.
        tests:
          - not_null

      - name: product_id
        description: Identifier for the product that was ordered.
        tests:
          - not_null

      - name: product_name
        description: Human-readable product name.

      - name: status
        description: Normalised (lowercase) order status.
        tests:
          - not_null
          - accepted_values:
              values: ["placed", "processing", "shipped", "delivered"]

      - name: amount
        description: Order value in USD. Always greater than zero after filtering.
        tests:
          - not_null

      - name: event_time
        description: Timestamp of the original order event.
