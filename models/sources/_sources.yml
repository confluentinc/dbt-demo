version: 2

models:
  - name: raw_orders
    description: >
      Streaming source table backed by the Flink Faker connector.
      Generates synthetic ecommerce order events at 5 rows/second —
      no Kafka producer or external data pipeline required.

    columns:
      - name: order_id
        description: Unique identifier for the order (synthetic, 1–1,000,000).
      - name: customer_id
        description: Identifier for the customer (synthetic, 1–500).
      - name: product_id
        description: Identifier for the product (synthetic, 1–50).
      - name: product_name
        description: Human-readable product name generated by Datafaker.
      - name: amount
        description: Order value in USD, two decimal places (range 5–500).
      - name: status
        description: "Order status: placed, processing, shipped, or delivered."
      - name: event_time
        description: Timestamp of the event, within the last 30 seconds.
