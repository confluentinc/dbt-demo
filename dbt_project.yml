name: confluent_demo
version: "1.0.0"
config-version: 2

profile: confluent_demo

model-paths: ["models"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  confluent_demo:
    +schema: "{{ env_var('CONFLUENT_DBNAME') }}"

    sources:
      +materialized: streaming_source
      +tags: ["source"]

    staging:
      +materialized: view
      +tags: ["staging"]

    marts:
      +materialized: materialized_table
      +tags: ["mart"]
